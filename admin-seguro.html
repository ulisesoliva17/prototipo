<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alta de seguro, Administrativa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="back-link" href="administrativa.html">&larr; Administrativa general</a>
  <a class="notif-link" href="notificaciones.html">Notificaciones <span class="unread-count">3</span></a>
</header>
<main>
  <h1>Alta del seguro del socio <span class="tag-hu">HU 8</span></h1>
  <div class="field">
    <label>Buscar socio por documento o nombre y apellido</label>
    <input type="text" value="Tomás Ibáñez">
  </div>
  <div class="card">
    <p><strong>Tomás Ibáñez</strong>, DNI 43567890</p>
    <p>Vóley Cadetes / Handball Cadetes</p>
  </div>
  <form>
    <div class="field">
      <label>Número de póliza</label>
      <input type="text" value="POL-2026-00981">
    </div>
    <div class="field">
      <label>Tipo de cobertura</label>
      <select>
        <option>Responsabilidad Civil</option>
        <option>Accidentes Personales</option>
      </select>
    </div>
    <div class="grid-2">
      <div class="field"><label>Fecha de alta</label><input type="text" value="18/09/2026"></div>
      <div class="field"><label>Fecha de vencimiento</label><input type="text" value="18/09/2027"></div>
    </div>
    <div class="btn-row">
      <button class="btn" type="button">Registrar seguro</button>
      <a class="btn outline" href="administrativa.html">Cancelar</a>
    </div>
  </form>
  <p class="note">Al registrar el seguro, el socio queda marcado como "con seguro activo".</p>
</main>
<footer class="footnote">Club RN, mockup estático sin backend, con fines ilustrativos.</footer>
</body>
</html>
